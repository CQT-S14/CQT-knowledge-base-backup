name: Sync Confluence to Markdown

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install confluence-markdown-exporter
        run: |
          curl -LsSf uvx.sh/confluence-markdown-exporter/install.sh | sh
          CME_PATH="$(command -v cme || find "$HOME" -name cme -type f 2>/dev/null | head -n1)"
          echo "Found cme at: $CME_PATH"
          dirname "$CME_PATH" >> "$GITHUB_PATH"

      - name: Restore Confluence credentials
        env:
          CME_APP_DATA_JSON: ${{ secrets.CME_APP_DATA_JSON }}
        run: |
          CONFIG_PATH="$(cme config path)"
          echo "cme expects its config at: $CONFIG_PATH"
          mkdir -p "$(dirname "$CONFIG_PATH")"
          printf '%s' "$CME_APP_DATA_JSON" > "$CONFIG_PATH"
          echo "Secret length received: ${#CME_APP_DATA_JSON} characters"
          echo "File size after write: $(wc -c < "$CONFIG_PATH") bytes"
          grep -o '"https://cqt-s14.atlassian.net[^"]*"' "$CONFIG_PATH" || echo "NO bare-domain URL found in file"
          python3 -c "import json; json.load(open('$CONFIG_PATH')); print('CI FILE: VALID JSON')"

      - name: Export CQTS14 space to Markdown
        env:
          CME_EXPORT__OUTPUT_PATH: ./content
        run: cme spaces https://cqt-s14.atlassian.net/wiki/spaces/CQTS14

      - name: Commit and push if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "No changes — nothing to commit."
          else
            git commit -m "chore: sync confluence content $(date -u +%Y-%m-%d)"
            git push
          fi